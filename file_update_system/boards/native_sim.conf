# FOTA Update System - Native Sim Configuration
# For desktop testing — no GPIO, no MCUboot, no flash hardware

# UART/Console
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Basic C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_GLIBCXX_LIBCPP=y

# Disable hardware features not available on native_sim
CONFIG_GPIO=n

# Shell — enabled for command testing on native_sim
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# System
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
