# FOTA Update System - Embedded Device Configuration
# MCUboot A/B swap with UART shell and version tracking

# GPIO for LED heartbeat
CONFIG_GPIO=y

# UART for communication with embedded Linux gateway
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Basic C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y

# MCUboot support — enables A/B swap with power-loss recovery
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_IMG_MANAGER=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_STREAM_FLASH=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y

# Shell — enables UART command parsing (version, status, update)
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y

# System
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3