# FOTA Update System - Embedded Device Configuration
# Minimal configuration for version tracking and UART communication

# GPIO for LED heartbeat
CONFIG_GPIO=y

# UART for communication with embedded Linux gateway
CONFIG_SERIAL=y
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y

# Basic C++ support
CONFIG_CPP=y
CONFIG_STD_CPP17=y
CONFIG_STD_CPP17=y
CONFIG_NEWLIB_LIBC=y

# System
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# Logging
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3