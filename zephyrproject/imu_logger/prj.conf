# Arduino Nano 33 BLE Rev2 - BLE IMU Streamer
# Streams live IMU data over Bluetooth

# Core
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=4096

# Console for debugging
CONFIG_PRINTK=y

# GPIO + I2C  
CONFIG_GPIO=y
CONFIG_I2C=y

# IMU sensors
CONFIG_SENSOR=y
CONFIG_BMI270=y
CONFIG_BMM150=y
CONFIG_CBPRINTF_FP_SUPPORT=y

# Bluetooth
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="IMU_Logger"
CONFIG_BT_DEVICE_APPEARANCE=833
CONFIG_BT_MAX_CONN=1
CONFIG_BT_MAX_PAIRED=1

# Increase MTU for 36-byte packets
CONFIG_BT_L2CAP_TX_MTU=65
CONFIG_BT_BUF_ACL_TX_SIZE=65
CONFIG_BT_BUF_ACL_RX_SIZE=65

# GATT
CONFIG_BT_GATT_CLIENT=n
CONFIG_BT_ATT_PREPARE_COUNT=2

# Output
CONFIG_BUILD_OUTPUT_BIN=y
CONFIG_BUILD_OUTPUT_HEX=y
```
